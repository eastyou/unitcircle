name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test unit circle generation
        run: |
          python -m unitcircle --angles 0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330 --title 单位圆转盘 -o unitcircle.html
          python -c "text = open('unitcircle.html', encoding='utf-8').read(); assert text.count('<section') == 3; assert '不存在' in text; assert 'A4 portrait' in text; assert '单位圆转盘' in text; print('smoke ok')"
